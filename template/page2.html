<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</form>
    </title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <div class="form-page">
        <div class="form">
            <a href="#">collage form</a>
        </div>
    </div>
    <div class="content-page">
        <div class="content">
            <form class="user">

                <label>name:</label>
                <input required type="text" placeholder="enter your name">
                <label>email:</label>
                <input required type="email" placeholder="enter your email">
                <label>phone no:</label>
                <input required type="number" placeholder="enter your number">
                <label>pic:</label>
                <input required type="file" placeholder="upload your file">
                <label>color</label>
                <input required type="color">
                <label>date:</label>
                <input required type="date">
                <label>Datetime:</label>
                <input required type="datetime">
                <label>I accept</label>
                <input required type="checkbox">
                <label>fathername:</label>
                <input required type="text">
                <div class="address">
                    <label>address:</label>
                    <input type="text" placeholder="your address">
                    <button>submit</button>
                </div>
            
            </form>


        </div>
    </div>
    
    





</body>

</html>
